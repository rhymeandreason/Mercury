<style>
  :root{
    color-scheme:light;
    --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f1f1ee; --ink:#18181b; --muted:#71717a; --faint:#a1a1aa;
    --line:#e6e6e2; --line-strong:#d6d6d1; --on-ink:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
  button{font:inherit;cursor:pointer;color:inherit}
  .fi{width:16px;height:16px;display:block}

  .stage{display:flex;flex-direction:column;align-items:center;gap:28px;width:100%;max-width:720px}
  h1{margin:4px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em;text-align:center}
  .sound{margin-top:6px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);font-size:12.5px;font-weight:500;color:var(--muted)}
  .sound:not(:disabled):hover{color:var(--ink);border-color:var(--line-strong)}
  .sound:disabled{cursor:default;opacity:.7}
  .sound.playing{color:var(--ink);border-color:var(--ink)}
  .head{display:flex;flex-direction:column;align-items:center}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .meta .sound{margin-top:0}
  .led{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}

  .device-row{display:flex;align-items:center;gap:16px;width:100%;justify-content:center}
  .arrow{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .arrow .fi{width:20px;height:20px}
  .arrow:not(:disabled):hover{border-color:var(--line-strong);background:var(--surface-2)}
  .arrow:disabled{opacity:.3;cursor:default;box-shadow:none}
  .arrow:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:2px}
  .device{flex:1;min-width:0;max-width:600px;aspect-ratio:239/109;position:relative}
  @media (max-width:560px){ .device-row{gap:6px} .arrow{width:34px;height:34px} .arrow .fi{width:16px;height:16px} }
  /* Screens cut instantly, like the hardware display (a crossfade let the page show through) */
  .device img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
  .device img.on{visibility:visible}
  /* Play button on the device (rect x182 y33 31×47 in the 239×109 artwork) */
  .power{position:absolute;left:76.15%;top:30.28%;width:12.97%;height:43.12%;border:none;border-radius:999px;background:transparent;padding:0;cursor:pointer}
  .power:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:3px}

  .nav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
  .icon-btn{display:grid;place-items:center;width:36px;height:36px;border:none;background:none;border-radius:9px;color:var(--muted)}
  .icon-btn:not(:disabled):hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn:disabled{opacity:.35;cursor:default}
  .steps{display:flex;gap:2px}
  .step{height:36px;width:36px;padding:0;border:none;border-radius:9px;background:none;font-size:13px;font-weight:500;color:var(--faint)}
  .step:hover{color:var(--ink)}
  .step[aria-current="step"]{background:var(--surface-2);color:var(--ink);font-weight:600}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .switch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
  .switch:hover{background:var(--surface-2)}
  .switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
  .switch .track{position:relative;width:30px;height:18px;border-radius:99px;background:var(--line-strong);transition:background .18s;flex:none}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
  .switch input:checked + .track{background:var(--ink)}
  .switch input:checked + .track::after{transform:translateX(12px);background:var(--surface)}
  :is(.icon-btn,.step,.sound):focus-visible,.switch:has(:focus-visible){outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:1px}
  .hint{font-size:12px;color:var(--faint);text-align:center}
  .vers{display:inline-flex;gap:2px;padding:2px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
  .vers:empty{display:none}
  .vers button{height:22px;min-width:24px;padding:0 6px;border:none;border-radius:99px;background:none;font-size:12px;font-weight:600;color:var(--muted)}
  .vers button:hover{color:var(--ink)}
  .vers button[aria-checked="true"]{background:var(--ink);color:var(--on-ink)}
  .vers button:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:1px}
  .vers button.wide{padding:0 9px}
  /* Live text on the display (screen rect x46 y36 128×40 in the 239×109 artwork); sizes in cqw scale with the device */
  .device{container-type:inline-size}
  .screentext{position:absolute;left:19.25%;top:33.03%;width:53.56%;height:36.7%;overflow:hidden;color:#fff;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:500;font-size:8.65cqw;line-height:1;white-space:nowrap;pointer-events:none}
  .screentext:empty{display:none}
  .screentext .track{position:absolute;top:50%;left:0;display:flex;transform:translateY(-50%);animation:marquee var(--loop) linear infinite}
  .screentext .track span{padding:0 6.7cqw 0 2.5cqw}
  @keyframes marquee{from{transform:translate(0,-50%)}to{transform:translate(-50%,-50%)}}
  .screentext .still{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .screentext .flip{position:absolute;inset:0;display:grid;place-items:center;animation:flip var(--cycle) steps(1,end) infinite}
  .screentext .flip + .flip{animation-delay:calc(var(--cycle) / -2)}
  @keyframes flip{0%{opacity:1}50%{opacity:0}}
  .playflow{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:none;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:600;white-space:nowrap}
  .playflow:hover{opacity:.88}
  .playflow:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:2px}
  .flows{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
  .flow{height:32px;padding:0 14px;border:none;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
  .flow:hover{color:var(--ink)}
  .flow[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .flow:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:1px}
  @media (max-width:560px){ h1{font-size:20px} .sep{display:none} }
</style>
</head>
<body>
<main class="stage">
  <div class="flows" id="flows" role="tablist" aria-label="Flow"></div>
  <div class="head">
    <h1 id="name"></h1>
    <div class="meta"><button class="sound" id="replay"></button><div class="vers" id="vers" role="radiogroup"></div><div class="vers" id="textvar" role="radiogroup" aria-label="Wording"></div><div class="vers" id="textmode" role="radiogroup" aria-label="Long text"></div><span class="led" id="led"></span></div>
  </div>

  <div class="device-row">
    <button class="arrow" id="prev" aria-label="Previous state"><svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="device" id="device">
      <div id="screens"></div>
      <div class="screentext" id="screentext" aria-live="polite"></div>
      <button class="power" id="power" aria-label="Play button"></button>
    </div>
    <button class="arrow" id="next" aria-label="Next state"><svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>

  <nav class="nav" aria-label="States">
    <button class="playflow" id="playflow"></button>
    <span class="sep"></span>
    <div class="steps" id="steps"></div>
    <span class="sep"></span>
    <label class="switch" title="Play each state's sound when it appears">
      <input type="checkbox" id="auto" checked><span class="track"></span>Sound
    </label>
  </nav>
  <div class="hint" id="hint"></div>
</main>

<script>
// HMI states and their screen artwork (239×109 SVGs; the display is the 128×40 rect at x46 y36).
// Inlined so this page is one self-contained file. DisplaySim.html reads the same data from hmi-screens.js;

<script>
// ---- Flows of states (SVGs embedded, in order), each with its sound from SoundDesign_Gray.html (version A) ----
const N = {C6:1046.5, C7:2093.0, D7:2349.3, E7:2637.0, G7:3136.0};
// note: [freq, start_ms, dur_ms, envelope, gain(0-1)]. Versions A, B… match SoundDesign_Gray.html.
const SOUNDS = {
  on:   { name:"Turn ON", level:0.5, versions:[
    { desc:"A wide leap with a crisp attack, landing on resonance.", notes:[[N.C7,0,140,"pluck",1],[N.G7,180,620,"bell",1]] },
    { desc:"The original octave leap (C6 to C7).", notes:[[N.C6,0,120,"pluck",1],[N.C7,150,550,"bell",1]] } ] },
  dock: { name:"Dock into Garment", level:0.5, versions:[
    { desc:"Charger's timing and attack on Dock's notes, E7 and C7.", notes:[[N.E7,0,160,"pluck",0.45],[N.C7,260,260,"bell",1]] },
    { desc:"The original tick and note (200 ms).", notes:[[N.E7,0,22,"pluck",0.45],[N.C7,60,140,"pluck",1]] } ] },
  start:{ name:"Start Treatment", level:0.5, versions:[
    { desc:"A lift into a ringing note, with longer notes and a crisp attack.", notes:[[N.D7,0,260,"pluck",1],[N.G7,360,520,"bell",1]] },
    { desc:"The original quicker lift (740 ms).", notes:[[N.D7,0,100,"pluck",1],[N.G7,140,600,"bell",1]] } ] },
  done: { name:"Treatment Finished", level:0.71, versions:[
    { desc:"Answers Start and rings out on the buzzer's resonance.", notes:[[N.D7,0,140,"pluck",1],[N.C7,160,140,"pluck",1],[N.E7,300,880,"bell",1],[N.G7,300,700,"bell",0.18]] } ] },
  low:  { name:"Battery is Low", level:0.71, versions:[
    { desc:"Start Treatment mirrored: the same pluck and ring, stepping down.", notes:[[N.G7,0,260,"pluck",1],[N.D7,360,520,"bell",1]] },
    { desc:"The same mirrored step, played twice so it reads as an alert.", notes:[[N.G7,0,200,"pluck",1],[N.D7,280,300,"bell",1],[N.G7,800,200,"pluck",1],[N.D7,1080,300,"bell",1]] } ] },
  plug: { name:"Charger Connected", level:0.5, versions:[
    { desc:"A short pluck stepping up into a brief ring.", notes:[[N.D7,0,125,"pluck",1],[N.G7,200,200,"bell",1]] } ] },
};

let picks = {};

const pick = id => { const v = picks[id]; return Number.isInteger(v) && v < SOUNDS[id].versions.length ? v : 0; };
const FLOWS = [
  { id:"main",    name:"Main Flow",    states:MAIN },
  { id:"battery", name:"Battery Flow", states:BATTERY },
];

// ---- Audio: same as the sound tool's defaults (Generic · Square buzzer · Single tone · Speaker sim · volume 60%) ----
const VOL = 0.6;
let ctx, current;
function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); return ctx; }
// One frequency at a time: chords keep their loudest note, overlapping notes are cut short
function monophonic(notes){
  const byStart = new Map();
  for(const n of notes){ const cur = byStart.get(n[1]); if(!cur || n[4] > cur[4]) byStart.set(n[1], n); }
  const seq = [...byStart.values()].sort((a,b)=>a[1]-b[1]).map(n=>n.slice());
  for(let i=0;i<seq.length-1;i++){ const end = seq[i][1]+seq[i][2], next = seq[i+1][1]; if(end > next) seq[i][2] = next - seq[i][1]; }
  return seq;
}
function play(id){
  const s = SOUNDS[id]; if(!s) return 0;
  const c = ac();
  if(current) current.gain.setTargetAtTime(0, c.currentTime, 0.01);   // cut off a sound still ringing
  const master = c.createGain(); master.gain.value = VOL * 0.35; current = master;
  const hp = c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=750; hp.Q.value=0.9;
  const pk = c.createBiquadFilter(); pk.type="peaking"; pk.frequency.value=2700; pk.Q.value=1.4; pk.gain.value=6;
  const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=6500; lp.Q.value=0.7;
  master.connect(hp); hp.connect(pk); pk.connect(lp); lp.connect(c.destination);
  const t0 = c.currentTime + 0.03, notes = monophonic(s.versions[pick(id)].notes);
  for(const [f,st,d,env,g] of notes){
    const t = t0 + st/1000, dur = d/1000;
    const o = c.createOscillator(); o.type = "square"; o.frequency.setValueAtTime(f, t);
    const a = c.createGain(), peak = g * s.level * 0.45;

    a.gain.exponentialRampToValueAtTime(peak, t + (env==="pluck" ? 0.004 : 0.02));
    a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  return Math.max(...notes.map(n=>n[1]+n[2]));
}

// ---- UI ----
const $ = id => document.getElementById(id);
const PLAY = '<svg class="fi" viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px"><polygon points="6 3 20 12 6 21"/></svg>';
let i = 0, playTimer, flow, STATES;
// LED blink: hard on/off, `blink` ms on then `blink` ms off, written into that state's SVG
function withBlink(src, ms){
  const svg = atob(src.split(",")[1]).replace("<defs>",
    `<style>@keyframes led{0%{opacity:1}50%{opacity:0}}#led{animation:led ${ms*2}ms steps(1,end) infinite}</style><defs>`);
  return "data:image/svg+xml;base64," + btoa(svg);
}
// LED color fade: smooth loop through `colors` and back to the first, one loop every `ms`
function withFade(src, {colors, ms}){
  const stops = [...colors, colors[0]].map((c,k,a)=>`${Math.round(k/(a.length-1)*100)}%{fill:${c}}`).join("");
  const svg = atob(src.split(",")[1])
    .replace(/<circle cx="19" cy="57" r="5" fill="[^"]*"\/>/, m => m.replace("<circle", '<circle id="ledc"'))
    .replace("<defs>", `<style>@keyframes ledfade{${stops}}#ledc{animation:ledfade ${ms}ms linear infinite}</style><defs>`);
  return "data:image/svg+xml;base64," + btoa(svg);
}
// An SVG's animation runs from when its image loads, and identical images share one clock.
// A fresh copy (unique trailing comment) restarts it, so the LED begins at its first frame
// (first fade color, blink on) every time the state appears.
let ledRun = 0;
const restartLED = src => "data:image/svg+xml;base64," + btoa(atob(src.split(",")[1]) + `<!--${++ledRun}-->`);
// Show state k's screen. An animated LED gets a fresh copy first, and the previous screen stays
// up until that copy is decoded, so there is never a blank or stale frame in between.
let screenRun = 0;
function showScreen(k){
  const run = ++screenRun, s = STATES[k], imgs = document.querySelectorAll(".device img"), im = imgs[k];
  const swap = () => {
    if(run !== screenRun) return;              // a later step took over
    imgs.forEach((x,n) => x.classList.toggle("on", n===k));
    $("screentext").style.visibility = "";
  };
  if(!(s.fade || s.blink)) return swap();
  $("screentext").style.visibility = "hidden"; // its text belongs on the new screen
  im.src = restartLED(s.img);
  im.decode().then(swap, swap);
}
FLOWS.forEach(f => f.states.forEach(s => {
  if(s.blink) s.img = withBlink(s.img, s.blink);
  if(s.fade) s.img = withFade(s.img, s.fade);
}));
$("flows").innerHTML = FLOWS.map(f=>`<button class="flow" role="tab" data-id="${f.id}">${f.name}</button>`).join("");
// Switch flow: rebuild its screens and steps, start at its first state (the URL hash remembers it)
function setFlow(id){
  flow = FLOWS.find(f => f.id === id) || FLOWS[0];
  STATES = flow.states;
  document.querySelectorAll(".flow").forEach(b => b.setAttribute("aria-selected", b.dataset.id === flow.id));
  $("screens").innerHTML = STATES.map((s,k)=>`<img src="${s.img}" alt="${s.name} display" ${k?'':'class="on"'}>`).join("");
  $("steps").innerHTML = STATES.map((s,k)=>`<button class="step" data-k="${k}" title="${s.name}" aria-label="${k+1}. ${s.name}">${k+1}</button>`).join("");
  document.title = flow.name;
  if(location.hash.slice(1) !== flow.id) history.replaceState(null, "", "#" + flow.id);
}
$("flows").onclick = e => { const b = e.target.closest(".flow"); if(b && b.dataset.id !== flow.id){ stopFlow(); setFlow(b.dataset.id); go(0); } };
try{ $("auto").checked = localStorage.getItem("hmi-flow-sound") !== "off"; }catch(e){}

function sound(){
  const id = STATES[i].sound; if(!id) return;
  const len = play(id), b = $("replay");
  b.classList.add("playing"); clearTimeout(playTimer);
  playTimer = setTimeout(()=>b.classList.remove("playing"), len + 80);
}
function go(k, withSound = true){
  i = Math.max(0, Math.min(STATES.length-1, k));
  const s = STATES[i];
  const isOff = s.led === "off";
  $("power").hidden = !isOff;   // the Play button only does something while the device is off
  $("hint").textContent = isOff ? "Press the Play button on the device to turn it on."
    : "Use the arrows or ← → to step through. Space replays the sound.";
  $("name").textContent = s.name;
  showScreen(i);
  document.querySelectorAll(".step").forEach((b,n)=>{ if(n===i) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  $("prev").disabled = i===0; $("next").disabled = i===STATES.length-1;
  const r = $("replay");
  r.disabled = !s.sound; r.classList.remove("playing");
  r.innerHTML = s.sound ? `${PLAY}Play sound` : "No sound";
  renderVersions();
  $("led").textContent = isOff ? "LED off"
    : s.blink ? `LED blinks · ${s.blink} ms on / ${s.blink} ms off`
    : s.fade ? `LED fades · ${s.fade.colors.join(" → ")} · ${s.fade.ms/1000} s loop`
    : "LED steady";
  renderText();
  if(withSound && $("auto").checked) sound();
}

// A/B toggle for the current state's sound (hidden when it has one version)
function renderVersions(){
  const id = STATES[i].sound, vs = id ? SOUNDS[id].versions : [];
  $("vers").setAttribute("aria-label", id ? `${SOUNDS[id].name} version` : "");
  $("vers").innerHTML = vs.length < 2 ? "" : vs.map((v,k)=>
    `<button role="radio" data-v="${k}" aria-checked="${k===pick(id)}" title="${SOUNDS[id].name} ${"ABCDEFGH"[k]}: ${v.desc}">${"ABCDEFGH"[k]}</button>`).join("");
}
$("vers").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  picks[STATES[i].sound] = +b.dataset.v;
  try{ localStorage.setItem("hmi-flow-versions", JSON.stringify(picks)); }catch(_){}
  renderVersions(); sound();
};

// Text too long for one screen, two options:
//   Scroll: loops right to left at SCROLL_PX px/s (px = the display's 128-px-wide artwork)
//   Step:   flips between the two halves, STEP_MS on each
const SCROLL_PX = 40, STEP_MS = 1000;
const TEXT_MODES = [{id:"scroll", label:"Scroll", desc:"Option 1: scrolling text"}, {id:"step", label:"Step", desc:"Option 2: step text"}];
let textMode = "scroll";
try{ textMode = localStorage.getItem("hmi-flow-textmode") === "step" ? "step" : "scroll"; }catch(e){}
function splitText(t){            // two halves at the space nearest the middle
  const sp = [...t.matchAll(/ /g)].map(m=>m.index);
  const at = sp.reduce((b,x)=>Math.abs(x - t.length/2) < Math.abs(b - t.length/2) ? x : b, sp[0]);
  return [t.slice(0, at), t.slice(at+1)];
}
function textInfo(s){ return textMode === "step" ? `Text steps · ${STEP_MS} ms each` : `Text scrolls · ${SCROLL_PX} px/s`; }
function scrollLoopMs(){          // one full loop of the marquee, from the rendered width
  const span = $("screentext").querySelector(".track span");
  if(!span) return 0;
  const px = span.getBoundingClientRect().width * 128 / $("screentext").getBoundingClientRect().width;
  return Math.round(px / SCROLL_PX * 1000);
}
// Wording variants (`texts` in the screen data above): the pick becomes the state's `text`, remembered per state
let textPicks = {};
try{ textPicks = JSON.parse(localStorage.getItem("hmi-flow-textvariants") || "{}"); }catch(e){}
const textPick = s => { const v = textPicks[s.name]; return Number.isInteger(v) && v < s.texts.length ? v : 0; };
const shortLabel = (t, all) => {   // drop the words every variant shares at the end ("… Garment")
  const words = all.map(x => x.split(" "));
  let n = 0; while(words.every(w => w.length > n+1 && w[w.length-1-n] === words[0][words[0].length-1-n])) n++;
  return t.split(" ").slice(0, t.split(" ").length - n).join(" ") || t;
};
// Fits when it leaves at least FIT_MARGIN px clear on each side of the 128-px screen
const FIT_MARGIN = 4;
function textFits(t){
  const el = $("screentext");
  el.innerHTML = `<div class="still">${t}</div>`;
  const r = document.createRange(); r.selectNodeContents(el.firstChild);
  const px = r.getBoundingClientRect().width * 128 / el.getBoundingClientRect().width;
  return px <= 128 - 2*FIT_MARGIN;
}
function renderText(){
  const s = STATES[i], el = $("screentext");
  if(s.texts) s.text = s.texts[textPick(s)];
  $("textvar").innerHTML = s.texts ? s.texts.map((t,k) =>
    `<button role="radio" class="wide" data-v="${k}" aria-checked="${k===textPick(s)}" title="${t}">${shortLabel(t, s.texts)}</button>`).join("") : "";
  if(!s.text){ el.innerHTML = ""; $("textmode").innerHTML = ""; return; }
  // Text that fits on one screen stays still; only longer text needs the Scroll / Step options
  s.fits = textFits(s.text);
  $("textmode").innerHTML = s.fits ? "" : TEXT_MODES.map(m =>
    `<button role="radio" class="wide" data-m="${m.id}" aria-checked="${m.id===textMode}" title="${m.desc}">${m.label}</button>`).join("");
  if(s.fits){
    el.innerHTML = `<div class="still">${s.text}</div>`;
    $("led").textContent = `LED blinks · ${s.blink} ms on / ${s.blink} ms off · Text fits on one screen`;
    return;
  }
  if(textMode === "step"){
    const [a,b] = splitText(s.text);
    el.style.setProperty("--cycle", STEP_MS*2 + "ms");
    el.innerHTML = `<div class="flip">${a}</div><div class="flip">${b}</div>`;
  } else {
    el.innerHTML = `<div class="track"><span>${s.text}</span><span aria-hidden="true">${s.text}</span></div>`;
    el.style.setProperty("--loop", scrollLoopMs() + "ms");
  }
  $("led").textContent = `LED blinks · ${s.blink} ms on / ${s.blink} ms off · ${textInfo(s)}`;
}
$("textvar").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  textPicks[STATES[i].name] = +b.dataset.v;
  try{ localStorage.setItem("hmi-flow-textvariants", JSON.stringify(textPicks)); }catch(_){}
  renderText();
};
$("textmode").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  textMode = b.dataset.m;
  try{ localStorage.setItem("hmi-flow-textmode", textMode); }catch(_){}
  renderText();
};
const remeasure = () => { if(STATES[i].text) renderText(); };   // fit and scroll speed depend on the rendered width
window.addEventListener("resize", remeasure);
document.fonts && document.fonts.ready.then(remeasure);   // the web font changes the text width

// Play flow: walk through every state of the current flow, holding each long enough
// for its sound to finish and a blinking LED to be seen. Any manual step stops it.
let flowTimer = null;
const STOP = '<svg class="fi" viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
function renderPlayFlow(){ $("playflow").innerHTML = flowTimer ? `${STOP}Stop` : `${PLAY}Play flow`; }
function hold(s){
  const len = s.sound && $("auto").checked ? Math.max(...monophonic(SOUNDS[s.sound].versions[pick(s.sound)].notes).map(n=>n[1]+n[2])) : 0;
  const read = !s.text || s.fits ? 0 : textMode === "step" ? STEP_MS * 4 : scrollLoopMs() + 600;   // long text: two flips each, or one full scroll
  return Math.max(s.blink ? 2400 : 1600, len + 1000, read);
}
function stopFlow(){ clearTimeout(flowTimer); flowTimer = null; renderPlayFlow(); }
function playFlow(){
  go(0);
  const step = () => {
    if(i >= STATES.length-1){ flowTimer = setTimeout(stopFlow, hold(STATES[i])); return; }
    flowTimer = setTimeout(() => { go(i+1); step(); }, hold(STATES[i]));
  };
  step(); renderPlayFlow();
}
$("playflow").onclick = () => flowTimer ? stopFlow() : playFlow();
renderPlayFlow();
const manual = f => (...a) => { stopFlow(); f(...a); };

$("prev").onclick = manual(() => go(i-1));
$("next").onclick = manual(() => go(i+1));
// The device's Play button turns it on from Off
$("power").onclick = manual(() => go(i+1));
$("steps").onclick = manual(e => { const b = e.target.closest(".step"); if(b) go(+b.dataset.k); });
$("replay").onclick = sound;
$("auto").onchange = e => { try{ localStorage.setItem("hmi-flow-sound", e.target.checked ? "on" : "off"); }catch(_){} };
document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); stopFlow(); go(i+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); stopFlow(); go(i-1); }
  // Space always replays, even when a just-clicked button (like an arrow) still has focus;
  // Enter still activates a focused button
  else if(e.key===" " && !e.target.closest("input")){ e.preventDefault(); sound(); }
  else if(/^[1-9]$/.test(e.key) && +e.key <= STATES.length){ stopFlow(); go(+e.key - 1); }
});
setFlow(location.hash.slice(1));
go(0, false);
</script>
</body>
